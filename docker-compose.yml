services:

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time API URL (baked into Next.js bundle)
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: fitai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fitai_db}
      - CHROMA_HOST=chromadb
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app          # hot-reload in development
      - ./data:/app/data:ro     # kho tri thức RAG (chỉ đọc)
      - ./data/eval/results:/app/eval_results   # kết quả đánh giá chatbot (ghi được, ngoài /app/data)
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fitai_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fitai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fitai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB Vector Store ────────────────────────────────────────────────────
  chromadb:
    # Ghim cùng phiên bản với chromadb-client trong backend/requirements.txt
    image: chromadb/chroma:1.5.9
    container_name: fitai_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data       # Chroma 1.x lưu dữ liệu tại /data (persist_path)

  # ── pgAdmin (optional dev tool) ──────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fitai_pgadmin
    restart: unless-stopped
    profiles:
      - dev                    # chỉ chạy khi: docker compose --profile dev up
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fitai.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  postgres_data:
  chroma_data:
